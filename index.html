<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D de Algoritmos de Ordenação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-background"></div>
    <header class="header">
        <h1>Visualizador 3D de Ordenação</h1>
    </header>

    <div class="main-layout">
        <div id="ui-container">
            <div class="controls">
                <div class="control-group mode-toggle">
                    <label class="radio-label"><input type="radio" name="mode" value="single" checked> <span class="radio-custom"></span> Simples</label>
                    <label class="radio-label"><input type="radio" name="mode" value="compare"> <span class="radio-custom"></span> Comparação</label>
                </div>

                <div class="control-group">
                    <label for="algorithm-select">Algoritmo (Principal):</label>
                    <div class="select-wrapper">
                        <select id="algorithm-select">
                            <option value="heap">Heap Sort</option>
                            <option value="bubble">Bubble Sort</option>
                            <option value="selection">Selection Sort</option>
                            <option value="insertion">Insertion Sort</option>
                            <option value="quick">Quick Sort</option>
                            <option value="merge">Merge Sort</option>
                            <option value="shell">Shell Sort</option>
                        </select>
                    </div>
                </div>

                <div class="control-group hidden" id="algo-2-group">
                    <label for="algorithm-select-2">Algoritmo (Comparação):</label>
                    <div class="select-wrapper">
                        <select id="algorithm-select-2">
                            <option value="merge" selected>Merge Sort</option>
                            <option value="bubble">Bubble Sort</option>
                            <option value="selection">Selection Sort</option>
                            <option value="insertion">Insertion Sort</option>
                            <option value="quick">Quick Sort</option>
                            <option value="heap">Heap Sort</option>
                            <option value="shell">Shell Sort</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <label for="custom-input">Valores (separados por vírgula):</label>
                    <textarea id="custom-input" rows="3" placeholder="ex: 10, 22, 46, 51, 34..."></textarea>
                </div>

                <div class="control-group">
                    <label for="speed-slider">Velocidade</label>
                    <input type="range" id="speed-slider" min="10" max="1000" value="100" dir="rtl">
                </div>

                <div class="button-group">
                    <button id="generate-btn" class="secondary-btn">Gerar Aleatório</button>
                    <button id="apply-custom-btn" class="secondary-btn">Aplicar Valores</button>
                    <button id="start-btn" class="primary-btn">Iniciar Ordenação</button>
                </div>
            </div>
        </div>

        <div id="main-wrapper">
            <div id="canvas-wrapper-1" class="canvas-wrapper">
                <div class="canvas-border">
                    <div id="canvas-container-1" class="three-container"></div>
                </div>
                <div id="canvas-label-1" class="canvas-label"></div>
            </div>
            <div id="canvas-wrapper-2" class="canvas-wrapper hidden">
                <div class="canvas-border">
                    <div id="canvas-container-2" class="three-container"></div>
                </div>
                <div id="canvas-label-2" class="canvas-label"></div>
            </div>
        </div>
    </div>

    <!-- Info container is floating -->
    <div id="info-container" class="hidden">
        <h2 id="info-title">Nome do Algoritmo</h2>
        <p id="info-description">Descrição do algoritmo aqui.</p>
        <div class="complexity">
            <p><strong>Complexidade de Tempo (Melhor):</strong> <span id="info-best"></span></p>
            <p><strong>Complexidade de Tempo (Média):</strong> <span id="info-avg"></span></p>
            <p><strong>Complexidade de Tempo (Pior):</strong> <span id="info-worst"></span></p>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Application Scripts -->
    <script src="visualizer.js"></script>
    <script src="sorting.js"></script>
    <script src="main.js"></script>
</body>
</html>
